<title>ParJump</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#14122a;
    --panel:#201d44;
    --panel-2:#282454;
    --line:#3b3768;
    --ink:#f3f1ff;
    --ink-dim:#a8a2cf;
    --red:#ee3b30;
    --red-ink:#3a0805;
    --green:#8fe38f;
    --green-ink:#0e3517;
    --blue:#5b8bf0;
    --purple:#8a6fe0;
    --gray:#7d8296;
    --gold:#f0b94e;
  }

  *{box-sizing:border-box;}

  html, body{
    height:100%;
    margin:0;
  }

  body{
    background:#000;
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .screen{
    position:relative;
    width:min(100vw, 166.6667vh);
    height:min(100vh, 60vw);
    overflow:hidden;
    background:#000;
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    display:block;
    outline:none;
  }
  canvas:focus{
    outline:3px solid var(--red);
    outline-offset:-3px;
  }

  .scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      180deg,
      rgba(0,0,0,.14) 0px,
      rgba(0,0,0,.14) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 3px
    );
    mix-blend-mode:multiply;
  }

  .play-hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
    background:rgba(10,8,26,.5);
    font-family:"Press Start 2P", monospace;
    font-size:clamp(9px, 2.2vw, 12px);
    letter-spacing:.04em;
    color:var(--ink);
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .play-hint.hidden{ opacity:0; }

  .win-banner{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:rgba(10,8,26,.72);
  }
  .win-banner[hidden]{ display:none; }
  .win-card{
    background:var(--panel);
    border:2px solid var(--red);
    border-radius:10px;
    padding:20px 24px;
    text-align:center;
    max-width:320px;
  }
  .gameover-card{ border-color:var(--gray); }
  .win-card h2{
    margin:0 0 14px;
    font-family:"Press Start 2P", monospace;
    font-size:15px;
    letter-spacing:.02em;
    color:var(--red);
    text-shadow:2px 2px 0 rgba(0,0,0,.4);
  }
  .win-stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .win-stats > div{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .win-stats span{
    font-family:"IBM Plex Mono", monospace;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .win-stats small{
    font-size:9px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .win-new-best{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
    height:12px;
  }

  .win-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn-primary, .btn-secondary{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    letter-spacing:.03em;
    border:none;
    border-radius:6px;
    padding:9px 20px;
    cursor:pointer;
    font-weight:600;
  }
  .btn-primary{ color:var(--red-ink); background:var(--red); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn-secondary{ color:var(--ink); background:var(--panel-2); border:1px solid var(--line); }
  .btn-secondary:hover{ filter:brightness(1.15); }
  .btn-secondary:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  /* ---- title screen ---- */

  .title-screen{
    position:absolute;
    inset:0;
    background-image:url("assets/parjump-hero.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
  }

  .title-scrim{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(10,8,26,.1) 0%, rgba(10,8,26,.3) 55%, rgba(10,8,26,.88) 100%);
  }

  .title-inner{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:14px 16px 16px;
  }

  .game-logo{
    margin:0;
    font-family:"Press Start 2P", monospace;
    font-size:clamp(18px, 5.5vw, 26px);
    color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,.6), 0 0 20px rgba(240,185,78,.7);
    line-height:1.4;
  }

  .title-bottom{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }

  .leaderboard{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-family:"IBM Plex Mono", monospace;
    background:rgba(10,8,26,.55);
    border:1px solid rgba(255,255,255,.14);
    padding:8px 10px;
    border-radius:8px;
    min-width:150px;
  }
  .lb-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .lb-title{ font-size:9px; letter-spacing:.1em; color:var(--ink-dim); text-transform:uppercase; }
  .hiscore-value{ font-size:15px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  .lb-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .lb-list li{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:var(--ink-dim);
  }
  .lb-list li .lb-rank{ color:var(--gold); width:14px; flex:none; }
  .lb-list li .lb-dist{ color:#fff; flex:1; font-variant-numeric:tabular-nums; }
  .lb-list li .lb-tag{ font-size:9px; letter-spacing:.05em; color:var(--ink-dim); }
  .lb-list li.lb-empty{ color:var(--ink-dim); font-style:italic; }

  #startBtn{
    font-family:"Press Start 2P", monospace;
    font-size:12px;
    letter-spacing:.03em;
    color:var(--red-ink);
    background:var(--gold);
    border:none;
    border-radius:6px;
    padding:12px 20px;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 22px rgba(240,185,78,.5);
  }
  #startBtn:hover{ filter:brightness(1.08); }
  #startBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
  #startBtn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

</style>

  <div class="screen">
        <canvas id="game" width="400" height="240" tabindex="0"></canvas>
        <div class="scanlines"></div>
        <div class="play-hint" id="playHint">▶ CLICK TO CONTROL</div>
        <div class="win-banner" id="winBanner" hidden>
          <div class="win-card">
            <h2>LEVEL CLEAR</h2>
            <div class="win-stats">
              <div><span id="finalDist">0M</span><small>distance</small></div>
              <div><span id="finalCoins">0</span><small>coins</small></div>
              <div><span id="finalMush">0</span><small>mushrooms</small></div>
              <div><span id="finalKO">0</span><small>stomps</small></div>
            </div>
            <p class="win-new-best" id="newBest" hidden>★ New high score ★</p>
            <div class="win-actions">
              <button id="playAgainBtn" class="btn-primary" type="button">Play Again</button>
              <button id="toTitleBtn" class="btn-secondary" type="button">Title Screen</button>
            </div>
          </div>
        </div>
        <div class="win-banner" id="gameOverBanner" hidden>
          <div class="win-card gameover-card">
            <h2>GAME OVER</h2>
            <div class="win-stats">
              <div><span id="goFinalDist">0M</span><small>distance</small></div>
              <div><span id="goFinalCoins">0</span><small>coins</small></div>
              <div><span id="goFinalMush">0</span><small>mushrooms</small></div>
              <div><span id="goFinalKO">0</span><small>stomps</small></div>
            </div>
            <p class="win-new-best" id="goNewBest" hidden>★ New high score ★</p>
            <div class="win-actions">
              <button id="retryBtn" class="btn-primary" type="button">Retry</button>
              <button id="toTitleBtn2" class="btn-secondary" type="button">Title Screen</button>
            </div>
          </div>
        </div>
        <div class="title-screen" id="titleScreen">
          <div class="title-scrim"></div>
          <div class="title-inner">
            <h2 class="game-logo">PARJUMP</h2>
            <div class="title-bottom">
              <div class="leaderboard" id="leaderboard">
                <div class="lb-head">
                  <span class="lb-title">Top Runs</span>
                  <span class="hiscore-value" id="hiscoreValue">0M</span>
                </div>
                <ol class="lb-list" id="lbList"></ol>
              </div>
              <button id="startBtn" type="button">▶ Start</button>
            </div>
          </div>
        </div>
      </div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width;   // 400 — logical drawing width
  var H = canvas.height;  // 240 — logical drawing height

  var GROUND_Y = 200;
  var GRASS_H = 8;
  var HERO_X = 90;        // hero's fixed screen position — the world moves, not the hero
  var HERO_W = 20, HERO_H = 30;

  var BASE_SPEED = 90;    // default auto-run speed, px/s
  var SPRINT_SPEED = 150; // holding right/D
  var EASE_SPEED = 40;    // holding left/A — still forward, just slower
  var SPEED_RAMP = 260;   // how fast run speed changes toward its target, px/s^2

  var GRAVITY = 560;
  var JUMP_V = -300;

  var COL = {
    sky2: "#dbe6ff",
    midHill: "#6fcf6f",
    nearHill: "#4fae55",
    grass: "#8fe38f", grassDark: "#5fae6c",
    dirt: "#7a5a3a", dirtDark: "#5c4128",
    trim: "#ee3b30",
    brick: "#c8763f", brickDark: "#8a4c26", brickLine: "#7a3f1f",
    body: "#3a63d8", belt: "#f0b94e", cap: "#e0392c", capBrim: "#a82a20",
    boot: "#5c3a1e", trimGreen: "#e0392c", skin: "#ffd9a0", eye: "#1c1832",
    hair: "#171310",
    enemyBody: "#8a5a2b", enemyBelly: "#f0e0c0",
    gold: "#f0b94e", goldDark: "#c9922f"
  };

  var STOMP_BOUNCE = -230;
  var HIT_INVULN = 1.1;
  var FLAG_X = 4000;
  var STARTING_LIVES = 2;
  var MAX_LIVES = 5;
  var COIN_LIFE_MILESTONE = 100;

  var bgImg = new Image();
  var bgReady = false;
  bgImg.onload = function(){ bgReady = true; };
  bgImg.src = "assets/parjump-bg.jpg";

  var canvasEl = canvas;
  var hero, cameraX, mushroomCount, defeatedCount, coinCount, platforms, mushrooms, coins, enemies, particles;
  var nextSpawnX, keys, jumpPrev, runSpeed, heroScaleCur, squash, wasOnGround;
  var gameWon, winTimer, gameOver, gameOverTimer, running = false;
  var t = 0, lastTime = null;

  var hint = document.getElementById("playHint");
  var winBanner = document.getElementById("winBanner");
  var gameOverBanner = document.getElementById("gameOverBanner");
  var playAgainBtn = document.getElementById("playAgainBtn");
  var retryBtn = document.getElementById("retryBtn");
  var toTitleBtn = document.getElementById("toTitleBtn");
  var toTitleBtn2 = document.getElementById("toTitleBtn2");
  var newBestEl = document.getElementById("newBest");
  var goNewBestEl = document.getElementById("goNewBest");
  var titleScreen = document.getElementById("titleScreen");
  var startBtn = document.getElementById("startBtn");
  var hiscoreValueEl = document.getElementById("hiscoreValue");
  var lbListEl = document.getElementById("lbList");

  var HS_KEY = "parjumpHighScore";
  var LB_KEY = "parjumpLeaderboard";
  var LB_MAX = 5;

  var SFX_NAMES = ["jump", "land", "stomp", "hurt", "mushroom", "coin", "win"];
  var sfx = {};
  SFX_NAMES.forEach(function(name){
    var a = new Audio("assets/sfx/" + name + ".mp3");
    a.preload = "auto";
    a.volume = 0.55;
    sfx[name] = a;
  });
  function playSfx(name){
    var base = sfx[name];
    if (!base) return;
    try {
      var el = base.cloneNode(true);
      el.volume = base.volume;
      el.play().catch(function(){ /* blocked or missing until generated */ });
    } catch(err){ /* audio unsupported, ignore */ }
  }

  function loadLeaderboard(){
    try {
      var raw = localStorage.getItem(LB_KEY);
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch(err){ return []; }
  }
  function saveLeaderboard(list){
    try { localStorage.setItem(LB_KEY, JSON.stringify(list)); } catch(err){ /* storage unavailable */ }
  }
  function migrateLegacyHighScore(){
    if (loadLeaderboard().length) return;
    var legacy = parseInt(localStorage.getItem(HS_KEY) || "0", 10);
    if (legacy > 0){
      saveLeaderboard([{ dist: legacy, win: null, at: 0 }]);
    }
  }
  function getHighScore(){
    var list = loadLeaderboard();
    return list.length ? list[0].dist : 0;
  }
  function renderLeaderboard(){
    var list = loadLeaderboard();
    lbListEl.innerHTML = "";
    if (!list.length){
      var empty = document.createElement("li");
      empty.className = "lb-empty";
      empty.textContent = "No runs yet";
      lbListEl.appendChild(empty);
      return;
    }
    list.slice(0, LB_MAX).forEach(function(entry, i){
      var li = document.createElement("li");
      var tag = entry.win === true ? "WIN" : entry.win === false ? "KO" : "—";
      li.innerHTML =
        "<span class=\"lb-rank\">" + (i + 1) + "</span>" +
        "<span class=\"lb-dist\">" + entry.dist + "M</span>" +
        "<span class=\"lb-tag\">" + tag + "</span>";
      lbListEl.appendChild(li);
    });
  }
  function refreshHighScoreDisplay(){
    hiscoreValueEl.textContent = getHighScore() + "M";
    renderLeaderboard();
  }
  function recordRun(distM, won){
    var prevBest = getHighScore();
    var list = loadLeaderboard();
    list.push({ dist: distM, win: !!won, at: Date.now() });
    list.sort(function(a, b){ return b.dist - a.dist; });
    list = list.slice(0, LB_MAX);
    saveLeaderboard(list);
    refreshHighScoreDisplay();
    return distM > prevBest;
  }

  function beginPlay(){
    titleScreen.style.display = "none";
    resetState({});
    running = true;
    try { canvas.focus(); } catch(err){ /* click handler covers hosts that block auto-focus */ }
    requestAnimationFrame(frame);
  }
  function backToTitle(){
    running = false;
    titleScreen.style.display = "";
    refreshHighScoreDisplay();
  }
  function startRun(){
    resetState({});
    running = true;
    canvas.focus();
    requestAnimationFrame(frame);
  }

  startBtn.addEventListener("click", beginPlay);
  toTitleBtn.addEventListener("click", backToTitle);
  toTitleBtn2.addEventListener("click", backToTitle);
  playAgainBtn.addEventListener("click", startRun);
  retryBtn.addEventListener("click", startRun);

  canvas.addEventListener("keydown", function(e){
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = true;
    if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) !== -1){
      e.preventDefault();
    }
  });
  canvas.addEventListener("keyup", function(e){
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = false;
  });
  canvas.addEventListener("click", function(){ canvas.focus(); });
  canvas.addEventListener("focus", function(){ hint.classList.add("hidden"); });
  canvas.addEventListener("blur", function(){ hint.classList.remove("hidden"); });
  try { canvas.focus(); } catch(err){ /* click handler covers hosts that block auto-focus */ }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function mod(a, n){ return ((a % n) + n) % n; }

  function spawnParticles(x, y, color){
    for (var i = 0; i < 8; i++){
      var ang = (Math.PI * 2 * i) / 8;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * (40 + Math.random() * 30),
        vy: Math.sin(ang) * (40 + Math.random() * 30) - 20,
        life: 0.4, color: color
      });
    }
  }

  function makeEnemy(minX, maxX, y){
    return {
      worldX: minX, minX: minX, maxX: Math.max(minX + 14, maxX), y: y,
      dir: 1, speed: 26 + Math.random() * 14, walkPhase: Math.random() * 10, dead: false
    };
  }

  function spawnCoinArc(startX){
    var count = 3 + Math.floor(Math.random() * 3);
    var baseY = GROUND_Y - (60 + Math.random() * 40);
    for (var i = 0; i < count; i++){
      var arc = Math.sin((i / (count - 1)) * Math.PI) * 22;
      coins.push({ worldX: startX + i * 14, y: baseY - arc, collected: false, spin: Math.random() * 10 });
    }
  }

  function maybeSpawn(){
    while (nextSpawnX < cameraX + W + 200 && nextSpawnX < FLAG_X - 90){
      var choice = Math.random();
      if (choice < 0.42){
        var py = GROUND_Y - (35 + Math.random() * 40);
        var pw = 46 + Math.random() * 34;
        platforms.push({ worldX: nextSpawnX, y: py, w: pw });
        var onTop = Math.random();
        if (onTop < 0.35){
          mushrooms.push({ worldX: nextSpawnX + pw / 2 - 8, y: py - 15, eaten: false, variant: Math.random() < 0.8 ? 0 : 1 });
        } else if (onTop < 0.62 && pw > 55){
          enemies.push(makeEnemy(nextSpawnX + 6, nextSpawnX + pw - 22, py - 14));
        }
      } else if (choice < 0.62) {
        mushrooms.push({ worldX: nextSpawnX + 20, y: GROUND_Y - 15, eaten: false, variant: Math.random() < 0.8 ? 0 : 1 });
      } else if (choice < 0.85) {
        enemies.push(makeEnemy(nextSpawnX, nextSpawnX + 55, GROUND_Y - 14));
      }
      if (Math.random() < 0.4){
        spawnCoinArc(nextSpawnX + 10);
      }
      nextSpawnX += 150 + Math.random() * 90;
    }
  }

  function update(dt){
    var right = !!(keys["ArrowRight"] || keys["d"]);
    var left = !!(keys["ArrowLeft"] || keys["a"]);
    var jumpNow = !!(keys[" "] || keys["ArrowUp"] || keys["w"]);

    var target = BASE_SPEED;
    if (right) target = SPRINT_SPEED;
    else if (left) target = EASE_SPEED;

    if (runSpeed < target) runSpeed = Math.min(target, runSpeed + SPEED_RAMP * dt);
    else if (runSpeed > target) runSpeed = Math.max(target, runSpeed - SPEED_RAMP * dt);

    if (!gameWon && !gameOver) cameraX += runSpeed * dt;

    if (jumpNow && !jumpPrev && hero.onGround){
      hero.vy = JUMP_V;
      hero.onGround = false;
      playSfx("jump");
    }
    jumpPrev = jumpNow;

    hero.vy += GRAVITY * dt;
    var prevBottom = hero.y + HERO_H;
    hero.y += hero.vy * dt;
    var newBottom = hero.y + HERO_H;

    var landed = false;
    if (hero.vy >= 0){
      for (var i = 0; i < platforms.length; i++){
        var p = platforms[i];
        var sx = p.worldX - cameraX;
        if (sx < HERO_X + HERO_W && sx + p.w > HERO_X){
          if (prevBottom <= p.y + 1 && newBottom >= p.y){
            hero.y = p.y - HERO_H;
            hero.vy = 0;
            landed = true;
            break;
          }
        }
      }
    }
    if (!landed){
      if (newBottom >= GROUND_Y){
        hero.y = GROUND_Y - HERO_H;
        hero.vy = 0;
        landed = true;
      }
    }
    hero.onGround = landed;

    if (!wasOnGround && hero.onGround){
      squash = 1;
      playSfx("land");
    }
    wasOnGround = hero.onGround;
    squash = Math.max(0, squash - dt * 5);

    if (hero.onGround && runSpeed > 8){
      hero.walkPhase += dt * (6 + runSpeed * 0.05);
    }

    var targetScale = hero.big ? 1.35 : 1;
    heroScaleCur += (targetScale - heroScaleCur) * Math.min(1, dt * 8);

    if (gameWon || gameOver){
      if (gameWon) winTimer -= dt;
      if (gameOver) gameOverTimer -= dt;
      if (gameWon && winTimer <= 0 && winBanner.hidden) showWinBanner();
      if (gameOver && gameOverTimer <= 0 && gameOverBanner.hidden) showGameOverBanner();
      for (var pi2 = particles.length - 1; pi2 >= 0; pi2--){
        var pt2 = particles[pi2];
        pt2.x += pt2.vx * dt; pt2.y += pt2.vy * dt; pt2.vy += 90 * dt; pt2.life -= dt;
        if (pt2.life <= 0) particles.splice(pi2, 1);
      }
      return;
    }

    maybeSpawn();

    if (hero.invuln > 0) hero.invuln = Math.max(0, hero.invuln - dt);

    for (var ei = 0; ei < enemies.length; ei++){
      var en = enemies[ei];
      if (en.dead) continue;

      en.worldX += en.dir * en.speed * dt;
      if (en.worldX <= en.minX){ en.worldX = en.minX; en.dir = 1; }
      else if (en.worldX >= en.maxX){ en.worldX = en.maxX; en.dir = -1; }
      en.walkPhase += dt * 6;

      var esx = en.worldX - cameraX;
      var eTop = en.y, eBottom = en.y + 14;
      var overlapX = (esx + 16 > HERO_X) && (esx < HERO_X + HERO_W);
      var overlapY = (hero.y + HERO_H > eTop) && (hero.y < eBottom);
      if (overlapX && overlapY){
        var stomp = hero.vy >= 0 && prevBottom <= eTop + 5;
        if (stomp){
          en.dead = true;
          defeatedCount++;
          hero.vy = STOMP_BOUNCE;
          hero.onGround = false;
          hero.y = eTop - HERO_H;
          spawnParticles(esx + 8, eTop + 6, COL.enemyBody);
          playSfx("stomp");
        } else if (hero.invuln <= 0){
          hero.invuln = HIT_INVULN;
          if (hero.big){
            hero.big = false;
            spawnParticles(HERO_X + HERO_W / 2, hero.y + HERO_H / 2, COL.trim);
          } else {
            hero.lives--;
            spawnParticles(HERO_X + HERO_W / 2, hero.y + HERO_H / 2, COL.trim);
            if (hero.lives <= 0){
              gameOver = true;
              gameOverTimer = 1.0;
              hero.vy = -180;
              hero.onGround = false;
            }
          }
          playSfx("hurt");
        }
      }
    }

    for (var m = 0; m < mushrooms.length; m++){
      var mu = mushrooms[m];
      if (mu.eaten) continue;
      var msx = mu.worldX - cameraX;
      if (msx + 16 > HERO_X && msx < HERO_X + HERO_W &&
          mu.y + 14 > hero.y && mu.y < hero.y + HERO_H){
        mu.eaten = true;
        mushroomCount++;
        if (mu.variant === 0){
          if (!hero.big) hero.big = true;
          spawnParticles(msx + 8, mu.y + 6, COL.trim);
        } else {
          hero.lives = Math.min(MAX_LIVES, hero.lives + 1);
          spawnParticles(msx + 8, mu.y + 6, COL.grass);
        }
        playSfx("mushroom");
      }
    }

    for (var c = 0; c < coins.length; c++){
      var co = coins[c];
      if (co.collected) continue;
      var csx = co.worldX - cameraX;
      if (csx + 10 > HERO_X && csx < HERO_X + HERO_W &&
          co.y + 10 > hero.y && co.y < hero.y + HERO_H){
        co.collected = true;
        coinCount++;
        spawnParticles(csx + 5, co.y + 5, COL.gold);
        if (coinCount % COIN_LIFE_MILESTONE === 0){
          hero.lives = Math.min(MAX_LIVES, hero.lives + 1);
          spawnParticles(csx + 5, co.y + 5, COL.trim);
        }
        playSfx("coin");
      }
    }

    platforms = platforms.filter(function(p){ return p.worldX + p.w > cameraX - 60; });
    mushrooms = mushrooms.filter(function(mu){ return mu.worldX > cameraX - 60; });
    coins = coins.filter(function(co){ return co.worldX > cameraX - 60; });
    enemies = enemies.filter(function(en){ return !en.dead && en.maxX + 20 > cameraX - 60; });

    var flagScreenX = FLAG_X - cameraX;
    if (flagScreenX <= HERO_X + 6){
      gameWon = true;
      winTimer = 1.0;
      hero.vy = -180;
      hero.onGround = false;
      spawnParticles(HERO_X + HERO_W / 2, hero.y + HERO_H / 2, COL.trim);
      spawnParticles(HERO_X + HERO_W / 2, hero.y + HERO_H / 2, COL.grass);
      playSfx("win");
    }

    for (var pi = particles.length - 1; pi >= 0; pi--){
      var pt = particles[pi];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 90 * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(pi, 1);
    }
  }

  function drawBackground(){
    if (!bgReady){
      ctx.fillStyle = COL.sky2;
      ctx.fillRect(0, 0, W, GROUND_Y);
      return;
    }
    var factor = 0.16;
    var drawH = GROUND_Y;
    var drawW = drawH * (bgImg.naturalWidth / bgImg.naturalHeight);
    var scrollX = mod(cameraX * factor, drawW);
    var x = -scrollX;
    while (x < W){
      ctx.drawImage(bgImg, x, 0, drawW, drawH);
      x += drawW;
    }
  }

  function hillBump(cx, baseY, r){
    ctx.beginPath();
    ctx.moveTo(cx - r, baseY);
    ctx.arc(cx, baseY, r, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
  }

  function drawHillLayer(color, radius, spacing, factor, alpha){
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color;
    var ph = mod(cameraX * factor, spacing);
    for (var cx = -ph - radius; cx < W + radius * 2; cx += spacing){
      hillBump(cx, GROUND_Y, radius);
    }
    ctx.globalAlpha = 1;
  }

  function drawGround(){
    var phaseG = mod(cameraX, 16);
    ctx.fillStyle = COL.grass;
    ctx.fillRect(0, GROUND_Y, W, GRASS_H);
    ctx.fillStyle = COL.grassDark;
    for (var gx = -phaseG; gx < W; gx += 16){
      ctx.fillRect(gx, GROUND_Y + GRASS_H - 3, 8, 3);
    }
    ctx.fillStyle = COL.trim;
    ctx.fillRect(0, GROUND_Y + GRASS_H - 1, W, 1.5);

    ctx.fillStyle = COL.dirt;
    ctx.fillRect(0, GROUND_Y + GRASS_H, W, H - (GROUND_Y + GRASS_H));
    ctx.fillStyle = COL.dirtDark;
    var phaseD = mod(cameraX, 20);
    var rowH = 10, colW = 20, row = 0;
    for (var y = GROUND_Y + GRASS_H; y < H; y += rowH){
      var offset = (row % 2 === 0) ? 0 : colW / 2;
      for (var x = -colW + offset - phaseD; x < W; x += colW){
        ctx.fillRect(x, y, colW - 3, 1.5);
      }
      row++;
    }
  }

  function drawFlag(){
    var sx = FLAG_X - cameraX;
    if (sx < -40 || sx > W + 40) return;
    var poleH = 70;
    var topY = GROUND_Y - poleH;
    var wave = Math.sin(t * 4) * 3;

    ctx.fillStyle = "#8a8a8a";
    ctx.fillRect(sx - 1, topY, 3, poleH);

    ctx.fillStyle = "#ffe08a";
    ctx.beginPath(); ctx.arc(sx + 0.5, topY - 4, 3, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = COL.trim;
    ctx.beginPath();
    ctx.moveTo(sx + 2, topY + 3);
    ctx.lineTo(sx + 22 + wave, topY + 9);
    ctx.lineTo(sx + 2, topY + 17);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = COL.grass;
    ctx.beginPath();
    ctx.moveTo(sx + 2, topY + 6.5);
    ctx.lineTo(sx + 14 + wave * 0.6, topY + 9.5);
    ctx.lineTo(sx + 2, topY + 12.5);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlatform(p){
    var sx = p.worldX - cameraX;
    if (sx + p.w < -20 || sx > W + 20) return;
    ctx.fillStyle = COL.brick;
    ctx.fillRect(sx, p.y, p.w, 10);
    ctx.fillStyle = COL.brickDark;
    ctx.fillRect(sx, p.y + 7, p.w, 3);
    ctx.strokeStyle = COL.brickLine;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, p.y + 5); ctx.lineTo(sx + p.w, p.y + 5); ctx.stroke();
    var brickW = 12, phase = mod(p.worldX, brickW * 2);
    for (var bx = -phase; bx < p.w; bx += brickW){
      ctx.beginPath(); ctx.moveTo(sx + bx, p.y); ctx.lineTo(sx + bx, p.y + 5); ctx.stroke();
    }
    for (var bx2 = -phase - brickW / 2; bx2 < p.w; bx2 += brickW){
      ctx.beginPath(); ctx.moveTo(sx + bx2, p.y + 5); ctx.lineTo(sx + bx2, p.y + 10); ctx.stroke();
    }
  }

  function drawMushroom(m){
    if (m.eaten) return;
    var sx = m.worldX - cameraX;
    if (sx < -20 || sx > W + 20) return;
    var capColor = m.variant === 0 ? COL.trim : COL.grass;
    ctx.fillStyle = "#efe8d2";
    ctx.fillRect(sx + 5, m.y + 7, 6, 7);
    ctx.fillStyle = capColor;
    ctx.beginPath();
    ctx.arc(sx + 8, m.y + 6, 8, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fff8ea";
    ctx.beginPath(); ctx.arc(sx + 4, m.y + 3, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 11, m.y + 2.5, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 8, m.y + 5, 1.3, 0, Math.PI * 2); ctx.fill();
  }

  function drawCoin(co){
    if (co.collected) return;
    var sx = co.worldX - cameraX;
    if (sx < -20 || sx > W + 20) return;
    var spin = Math.abs(Math.sin(t * 4 + co.spin));
    var rx = 5 * (0.25 + spin * 0.75);
    ctx.fillStyle = COL.goldDark;
    ctx.beginPath();
    ctx.ellipse(sx + 5, co.y + 5, rx, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COL.gold;
    ctx.beginPath();
    ctx.ellipse(sx + 5, co.y + 4, rx * 0.65, 3.4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEnemy(en){
    if (en.dead) return;
    var sx = en.worldX - cameraX;
    if (sx < -20 || sx > W + 20) return;
    var waddle = Math.sin(en.walkPhase) * 2;
    var w = 16, h = 14, y = en.y;

    ctx.fillStyle = COL.boot;
    ctx.fillRect(sx + 2, y + h - 3 - Math.max(0, waddle), 5, 3);
    ctx.fillRect(sx + w - 7, y + h - 3 - Math.max(0, -waddle), 5, 3);

    ctx.fillStyle = COL.enemyBody;
    ctx.beginPath();
    ctx.moveTo(sx, y + h - 4);
    ctx.arc(sx + w / 2, y + 7, w / 2, Math.PI, 0);
    ctx.lineTo(sx + w, y + h - 4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = COL.enemyBelly;
    ctx.fillRect(sx + 4, y + 8, w - 8, h - 10);

    ctx.fillStyle = "#fff8ea";
    ctx.beginPath(); ctx.arc(sx + 5, y + 7, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + w - 5, y + 7, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.eye;
    ctx.beginPath(); ctx.arc(sx + 5, y + 7.5, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + w - 5, y + 7.5, 1.2, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = "#5c3a1e";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx + 2, y + 3); ctx.lineTo(sx + 7, y + 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + w - 2, y + 3); ctx.lineTo(sx + w - 7, y + 5); ctx.stroke();
  }

  function drawParticles(){
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / 0.4);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  function drawHero(){
    var idle = hero.onGround && runSpeed < 10;
    var bob = idle ? Math.sin(t * 2.2) * 1.5 : 0;
    var blink = (Math.sin(t * 0.6) > 0.985);
    var legSwing = hero.onGround ? Math.sin(hero.walkPhase) * 4 : 0;

    var x = HERO_X, w = HERO_W, h = HERO_H;
    var y = hero.y + bob;
    var feetY = hero.y + h;

    ctx.save();
    if (hero.invuln > 0 && Math.floor(t * 14) % 2 === 0){
      ctx.globalAlpha = 0.35;
    }
    ctx.translate(x + w / 2, feetY);
    var sx = heroScaleCur * (1 + squash * 0.14);
    var sy = heroScaleCur * (1 - squash * 0.22);
    ctx.scale(sx, sy);
    var tilt = hero.onGround ? Math.min(0.12, runSpeed / 1400) : 0;
    ctx.rotate(tilt);
    ctx.translate(-(x + w / 2), -feetY);

    ctx.fillStyle = "rgba(10,8,26,0.28)";
    ctx.beginPath();
    ctx.ellipse(x + w / 2, GROUND_Y + 3, w * 0.5, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = COL.boot;
    var legY = y + h - 6;
    ctx.fillRect(x + 3, legY - Math.max(0, legSwing), 5, 6);
    ctx.fillRect(x + w - 8, legY - Math.max(0, -legSwing), 5, 6);

    ctx.fillStyle = COL.hair;
    ctx.beginPath(); ctx.arc(x + w / 2, y + 5, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x + 2, y + 4, 4, 8);
    ctx.fillRect(x + w - 6, y + 4, 4, 8);

    ctx.fillStyle = COL.body;
    ctx.fillRect(x + 2, y + 12, w - 4, h - 18);

    ctx.fillStyle = COL.trimGreen;
    ctx.fillRect(x + 2, y + 12, w - 4, 2);

    ctx.fillStyle = COL.belt;
    ctx.beginPath(); ctx.arc(x + w / 2 - 3, y + 19, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w / 2 + 3, y + 19, 1.6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = COL.skin;
    ctx.fillRect(x + 3, y, w - 6, 13);

    ctx.fillStyle = COL.cap;
    ctx.fillRect(x + 1, y - 2, w - 2, 5);
    ctx.fillStyle = COL.capBrim;
    ctx.fillRect(x + w - 3, y + 1, 4, 2);

    ctx.fillStyle = COL.eye;
    if (blink){
      ctx.fillRect(x + w - 8, y + 7, 4, 1.5);
    } else {
      ctx.fillRect(x + w - 8, y + 5, 3, 3);
    }

    ctx.restore();
  }

  function drawHeartIcon(cx, cy){
    ctx.fillStyle = COL.trim;
    ctx.beginPath();
    ctx.arc(cx - 2, cy, 2.2, 0, Math.PI * 2);
    ctx.arc(cx + 2, cy, 2.2, 0, Math.PI * 2);
    ctx.moveTo(cx - 4, cy + 1);
    ctx.lineTo(cx, cy + 5);
    ctx.lineTo(cx + 4, cy + 1);
    ctx.closePath();
    ctx.fill();
  }

  function drawHUD(){
    ctx.save();
    ctx.textBaseline = "top";
    ctx.font = "9px 'Press Start 2P', monospace";
    ctx.fillStyle = "rgba(15,12,36,0.55)";
    ctx.fillRect(8, 8, 176, 58);

    ctx.fillStyle = COL.sky2;
    ctx.fillText("DIST " + Math.floor(cameraX / 10) + "M", 15, 14);

    ctx.fillStyle = "#efe8d2";
    ctx.fillRect(16, 29, 4, 5);
    ctx.fillStyle = COL.trim;
    ctx.beginPath(); ctx.arc(18, 28, 5, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = COL.sky2;
    ctx.fillText("x " + mushroomCount, 30, 27);

    ctx.fillStyle = COL.goldDark;
    ctx.beginPath(); ctx.ellipse(103, 30, 3.5, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.ellipse(103, 29, 2.4, 3.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.sky2;
    ctx.fillText("x " + coinCount, 112, 27);

    ctx.fillStyle = COL.enemyBody;
    ctx.fillRect(15, 43, 8, 6);
    ctx.strokeStyle = COL.trim;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(14, 41); ctx.lineTo(24, 49); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(24, 41); ctx.lineTo(14, 49); ctx.stroke();
    ctx.fillStyle = COL.sky2;
    ctx.fillText("x " + defeatedCount, 30, 43);

    var heartCount = Math.min(hero.lives, 5);
    for (var hI = 0; hI < heartCount; hI++){
      drawHeartIcon(97 + hI * 11, 45);
    }
    if (hero.lives > 5){
      ctx.fillStyle = COL.sky2;
      ctx.fillText("+" + (hero.lives - 5), 97 + 5 * 11, 43);
    }

    ctx.restore();
  }

  function render(){
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawHillLayer(COL.midHill, 70, 190, 0.35, 0.55);
    drawHillLayer(COL.nearHill, 50, 130, 0.6, 0.85);
    drawGround();
    drawFlag();
    for (var i = 0; i < platforms.length; i++) drawPlatform(platforms[i]);
    for (var j = 0; j < mushrooms.length; j++) drawMushroom(mushrooms[j]);
    for (var n = 0; n < coins.length; n++) drawCoin(coins[n]);
    for (var k = 0; k < enemies.length; k++) drawEnemy(enemies[k]);
    drawHero();
    drawParticles();
    drawHUD();
  }

  function frame(now){
    if (!running) return;
    if (lastTime === null) lastTime = now;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    t += dt;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function showWinBanner(){
    var distM = Math.floor(cameraX / 10);
    document.getElementById("finalDist").textContent = distM + "M";
    document.getElementById("finalCoins").textContent = String(coinCount);
    document.getElementById("finalMush").textContent = String(mushroomCount);
    document.getElementById("finalKO").textContent = String(defeatedCount);
    var isNewBest = recordRun(distM, true);
    newBestEl.hidden = !isNewBest;
    winBanner.hidden = false;
  }

  function showGameOverBanner(){
    var distM = Math.floor(cameraX / 10);
    document.getElementById("goFinalDist").textContent = distM + "M";
    document.getElementById("goFinalCoins").textContent = String(coinCount);
    document.getElementById("goFinalMush").textContent = String(mushroomCount);
    document.getElementById("goFinalKO").textContent = String(defeatedCount);
    var isNewBest = recordRun(distM, false);
    goNewBestEl.hidden = !isNewBest;
    gameOverBanner.hidden = false;
  }

  function resetState(data){
    data = data || {};
    cameraX = data.cameraX || 0;
    mushroomCount = data.mushroomCount || 0;
    defeatedCount = data.defeatedCount || 0;
    coinCount = data.coinCount || 0;
    hero = {
      y: typeof data.heroY === "number" ? data.heroY : GROUND_Y - HERO_H,
      vy: 0, onGround: true, big: !!data.big,
      lives: typeof data.lives === "number" ? data.lives : STARTING_LIVES,
      walkPhase: 0, invuln: 0
    };
    platforms = [];
    mushrooms = [];
    coins = [];
    enemies = [];
    particles = [];
    nextSpawnX = cameraX + 260;
    keys = {};
    jumpPrev = false;
    runSpeed = 0;
    heroScaleCur = hero.big ? 1.35 : 1;
    squash = 0;
    wasOnGround = true;
    gameWon = false;
    winTimer = 0;
    gameOver = false;
    gameOverTimer = 0;
    winBanner.hidden = true;
    gameOverBanner.hidden = true;
    t = 0;
    lastTime = null;
  }

  function boot(){
    resetState({});
    migrateLegacyHighScore();
    refreshHighScoreDisplay();
  }

  if (window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){
      return hero ? { cameraX: cameraX, mushroomCount: mushroomCount, defeatedCount: defeatedCount, coinCount: coinCount, big: hero.big, lives: hero.lives, heroY: hero.y } : {};
    });
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(boot);
  } else {
    boot();
  }
})();
</script>
