name: Deploy to server

on:
  push:
    branches:
      - main

# Deploys must apply in order, one at a time — never let a slower run for an
# older commit clobber a newer one that finished first.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server, deploy atomically, roll back on failure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}

            if [ -d .git ]; then
              PREV_SHA=$(git rev-parse HEAD)
              git fetch origin main
            else
              git init
              git remote add origin https://github.com/paryardalani/ParJump.git
              git fetch origin main
              PREV_SHA=""
            fi

            # Hard reset instead of pull: no merge conflicts from stray local
            # edits, and the working tree always ends up exactly matching main.
            git reset --hard origin/main

            # Basic sanity check before calling the deploy good.
            if [ ! -s index.html ]; then
              echo "index.html missing or empty after deploy — bad release"
              if [ -n "$PREV_SHA" ]; then
                echo "Rolling back to $PREV_SHA"
                git reset --hard "$PREV_SHA"
              fi
              exit 1
            fi

            echo "Deployed $(git rev-parse HEAD)"
