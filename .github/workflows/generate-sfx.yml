name: Generate sound effects (ElevenLabs)

on:
  push:
    branches:
      - main
    paths:
      - assets/sfx-manifest.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sound effects via ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node .github/scripts/generate-sfx.mjs

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/sfx
          if git diff --cached --quiet; then
            echo "No sound effect changes to commit"
          else
            git commit -m "Generate sound effects via ElevenLabs"
            git push
          fi
